<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="calcGasTitle calcGasDesc">
  <title id="calcGasTitle">Infografik: Rechenweg von Zählerständen zu Kilowattstunden (kWh)</title>
  <desc id="calcGasDesc">Zwei Berechnungsschritte: Schritt 1 Zählerdifferenz 8.450 minus 7.250 gleich 1.200 Kubikmeter. Schritt 2 Thermische Umrechnung 1.200 mal Brennwert 10,8 mal Zustandszahl 0,95 gleich 12.312 kWh.</desc>
  <defs>
    <style>
      .canvas { fill: #ffffff; }
      .box { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 2; rx: 12; }
      .box-active { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; rx: 12; }
      .text-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; }
      .text-body { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; }
      .text-val { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 24px; }
      .text-highlight { fill: #0369a1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 28px; }
      .badge-step { fill: #0284c7; rx: 6; }
      .badge-step-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; }
      .op { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 22px; text-anchor: middle; }
    </style>
  </defs>

  <rect width="800" height="360" class="canvas" />

  <!-- Outer Card Frame -->
  <rect x="20" y="20" width="760" height="320" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(45, 50)">
    <text class="text-title" font-size="18">Zwei-Stufen-Formel: Gaszählerstand in abrechenbare kWh umrechnen</text>
    <text class="text-body" y="22">Beispielrechnung aus einer regulären Jahresabrechnung mit 12 Monaten Zeitraum</text>
  </g>

  <!-- STEP 1: ZÄHLERDIFFERENZ (m³) -->
  <g transform="translate(45, 95)">
    <!-- Step Badge -->
    <rect width="70" height="24" class="badge-step" />
    <text x="35" y="16" text-anchor="middle" class="badge-step-text">SCHRITT 1</text>
    <text x="82" y="18" class="text-title" font-size="15">Volumen-Differenz am Gaszähler ermitteln</text>

    <!-- Calculation Container -->
    <g transform="translate(0, 35)">
      <!-- Box Neuer Stand -->
      <rect x="0" y="0" width="160" height="65" class="box" />
      <text x="15" y="24" class="text-body" font-size="12">Neuer Zählerstand</text>
      <text x="15" y="50" class="text-val">8.450 m³</text>

      <!-- Minus Symbol -->
      <text x="185" y="38" class="op">−</text>

      <!-- Box Alter Stand -->
      <rect x="210" y="0" width="160" height="65" class="box" />
      <text x="225" y="24" class="text-body" font-size="12">Alter Zählerstand</text>
      <text x="225" y="50" class="text-val">7.250 m³</text>

      <!-- Equals Symbol -->
      <text x="395" y="38" class="op">=</text>

      <!-- Box Ergebnis m3 -->
      <rect x="420" y="0" width="290" height="65" class="box-active" />
      <text x="435" y="24" class="text-body" font-size="12" fill="#0369a1" font-weight="600">Verbrauchtes Gasvolumen</text>
      <text x="435" y="50" class="text-highlight" font-size="24">1.200 m³ Gas</text>
    </g>
  </g>

  <!-- STEP 2: THERMISCHE UMRECHNUNG (kWh) -->
  <g transform="translate(45, 220)">
    <!-- Step Badge -->
    <rect width="70" height="24" class="badge-step" />
    <text x="35" y="16" text-anchor="middle" class="badge-step-text">SCHRITT 2</text>
    <text x="82" y="18" class="text-title" font-size="15">Thermische Umrechnung nach DVGW G 685</text>

    <!-- Calculation Container -->
    <g transform="translate(0, 35)">
      <!-- Box m3 -->
      <rect x="0" y="0" width="140" height="65" class="box" />
      <text x="15" y="24" class="text-body" font-size="12">Volumen</text>
      <text x="15" y="50" class="text-val" font-size="20">1.200 m³</text>

      <!-- Multiply -->
      <text x="160" y="38" class="op">×</text>

      <!-- Box Brennwert -->
      <rect x="180" y="0" width="140" height="65" class="box" />
      <text x="195" y="24" class="text-body" font-size="12">Brennwert (Hs)</text>
      <text x="195" y="50" class="text-val" font-size="20">10,8 kWh/m³</text>

      <!-- Multiply -->
      <text x="340" y="38" class="op">×</text>

      <!-- Box Zustandszahl -->
      <rect x="360" y="0" width="130" height="65" class="box" />
      <text x="375" y="24" class="text-body" font-size="12">Zustandszahl (z)</text>
      <text x="375" y="50" class="text-val" font-size="20">0,95</text>

      <!-- Equals -->
      <text x="510" y="38" class="op">=</text>

      <!-- Box Ergebnis kWh -->
      <rect x="530" y="0" width="180" height="65" rx="10" fill="#0284c7" stroke="#0369a1" stroke-width="2" />
      <text x="545" y="24" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">ABRECHNUNGSMENGE</text>
      <text x="545" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22">12.312 kWh</text>
    </g>
  </g>
</svg>
