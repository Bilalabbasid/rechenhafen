<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="gasCostSvgTitle gasCostSvgDesc">
  <title id="gasCostSvgTitle">Gaskosten berechnen: Formel und Zusammensetzung</title>
  <desc id="gasCostSvgDesc">Schematische Darstellung der Gaskostenberechnung: Umrechnung von Kubikmetern in Kilowattstunden, Arbeitspreis, Grundpreis und Monatsabschlag.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 14; }
      .card-accent { fill: #ffffff; stroke: #0284c7; stroke-width: 2; rx: 14; }
      .primary { fill: #0284c7; }
      .primary-dark { fill: #0369a1; }
      .primary-light { fill: #e0f2fe; }
      .warm-accent { fill: #f97316; }
      .warm-light { fill: #ffedd5; }
      .success-light { fill: #ecfdf5; stroke: #10b981; }
      .text-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; }
      .text-head { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; }
      .text-body { fill: #334155; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
      .text-sub { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .math-badge { fill: #0f172a; rx: 6; }
      .math-text { fill: #38bdf8; font-family: "Courier New", monospace; font-weight: bold; font-size: 14px; }
      .arrow { stroke: #0284c7; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-head { fill: #0284c7; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" class="bg" />

  <!-- Top Title Bar -->
  <text x="400" y="38" text-anchor="middle" class="text-title" font-size="20">Wie setzen sich Ihre jährlichen Gaskosten zusammen?</text>
  <text x="400" y="60" text-anchor="middle" class="text-sub" font-size="13">Von den abgelesenen Zählerständen (m³) über thermische Energie (kWh) zum fairen Monatsabschlag (€)</text>

  <!-- Step 1: Meter reading to kWh conversion (Left Box) -->
  <g transform="translate(40, 85)">
    <rect width="215" height="235" class="card" />
    <rect x="0" y="0" width="215" height="38" rx="14" fill="#f1f5f9" />
    <rect x="0" y="24" width="215" height="14" fill="#f1f5f9" />
    <text x="107" y="25" text-anchor="middle" class="text-head" font-size="13">1. Zählerstand (m³ → kWh)</text>

    <!-- Gas meter visual mini -->
    <rect x="25" y="52" width="165" height="48" rx="8" fill="#0f172a" />
    <text x="107" y="82" text-anchor="middle" fill="#38bdf8" font-family="'Courier New', monospace" font-weight="bold" font-size="20">1.400,0 m³</text>
    <text x="107" y="116" text-anchor="middle" class="text-sub">Zählerdifferenz (Neu - Alt)</text>

    <!-- Conversion formula -->
    <rect x="15" y="132" width="185" height="60" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5" />
    <text x="107" y="152" text-anchor="middle" class="text-body" font-size="11" font-weight="700">kWh = m³ × Brennwert × z</text>
    <text x="107" y="169" text-anchor="middle" fill="#0369a1" font-size="11">1.400 m³ × 10,3 × 0,95</text>
    <text x="107" y="184" text-anchor="middle" fill="#0f172a" font-weight="700" font-size="12">= 13.699 kWh</text>

    <!-- Sub note -->
    <text x="107" y="212" text-anchor="middle" class="text-sub">Brennwert &amp; z auf Rechnung</text>
  </g>

  <!-- Plus Arrow to Components -->
  <g transform="translate(262, 190)">
    <line x1="0" y1="12" x2="24" y2="12" class="arrow" />
    <polygon points="26,12 18,7 18,17" class="arrow-head" />
  </g>

  <!-- Step 2: The Two Tariff Cost Components (Middle Stack) -->
  <!-- 2A: Arbeitspreis (Top) -->
  <g transform="translate(295, 85)">
    <rect width="240" height="110" class="card" />
    <rect x="12" y="12" width="32" height="32" rx="8" class="primary-light" />
    <text x="28" y="34" text-anchor="middle" fill="#0284c7" font-weight="bold" font-size="16">A</text>
    <text x="54" y="27" class="text-head">Verbrauchskosten</text>
    <text x="54" y="42" class="text-sub">Arbeitspreis je kWh</text>

    <line x1="12" y1="52" x2="228" y2="52" stroke="#f1f5f9" stroke-width="1.5" />

    <text x="18" y="74" class="text-body" font-size="12">13.699 kWh × 10,5 ct/kWh</text>
    <rect x="135" y="68" width="90" height="30" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
    <text x="180" y="88" text-anchor="middle" fill="#15803d" font-weight="bold" font-size="14">1.438,40 €</text>
    <text x="18" y="94" class="text-sub">abhängig vom Heizen</text>
  </g>

  <!-- Plus sign between 2A and 2B -->
  <circle cx="415" cy="207" r="14" fill="#0284c7" />
  <text x="415" y="213" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="18">+</text>

  <!-- 2B: Grundpreis (Bottom) -->
  <g transform="translate(295, 222)">
    <rect width="240" height="98" class="card" />
    <rect x="12" y="12" width="32" height="32" rx="8" class="warm-light" />
    <text x="28" y="34" text-anchor="middle" fill="#ea580c" font-weight="bold" font-size="16">B</text>
    <text x="54" y="27" class="text-head">Bereitstellungskosten</text>
    <text x="54" y="42" class="text-sub">Fester monatlicher Grundpreis</text>

    <line x1="12" y1="50" x2="228" y2="50" stroke="#f1f5f9" stroke-width="1.5" />

    <text x="18" y="72" class="text-body" font-size="12">12 Monate × 12,00 €</text>
    <rect x="135" y="60" width="90" height="28" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1" />
    <text x="180" y="79" text-anchor="middle" fill="#c2410c" font-weight="bold" font-size="14">144,00 €</text>
    <text x="18" y="88" class="text-sub">Zählermiete &amp; Messung</text>
  </g>

  <!-- Equals Arrow to Results -->
  <g transform="translate(542, 190)">
    <line x1="0" y1="12" x2="24" y2="12" class="arrow" />
    <polygon points="26,12 18,7 18,17" class="arrow-head" />
  </g>

  <!-- Step 3: Total Annual Cost and Monthly Advance (Right Card) -->
  <g transform="translate(575, 85)">
    <rect width="185" height="235" class="card-accent" />
    <rect x="0" y="0" width="185" height="38" rx="14" fill="#0284c7" />
    <rect x="0" y="24" width="185" height="14" fill="#0284c7" />
    <text x="92" y="25" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="13">3. Gesamtkosten</text>

    <!-- Annual result -->
    <text x="92" y="62" text-anchor="middle" class="text-sub" font-size="11">GESAMTE JAHRESKOSTEN</text>
    <rect x="15" y="70" width="155" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="92" y="98" text-anchor="middle" class="text-title" font-size="20" fill="#0f172a">1.582,40 €</text>

    <!-- Divider line -->
    <line x1="20" y1="124" x2="165" y2="124" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Monthly average -->
    <text x="92" y="146" text-anchor="middle" class="text-sub" font-size="11">MONATLICHER DURCHSCHNITT</text>
    <rect x="15" y="154" width="155" height="46" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
    <text x="92" y="184" text-anchor="middle" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="22">131,87 €</text>

    <text x="92" y="214" text-anchor="middle" class="text-sub" font-size="10">Richtwert für den Abschlag</text>
  </g>

  <!-- Bottom Notice Banner -->
  <g transform="translate(40, 340)">
    <rect width="720" height="85" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="36" cy="42" r="14" fill="#f1f5f9" />
    <text x="36" y="47" text-anchor="middle" fill="#0284c7" font-weight="bold" font-size="16">ℹ</text>
    <text x="65" y="32" class="text-head" font-size="13">Wichtiger Praxis-Hinweis zu monatlichen Versorgerabschlägen</text>
    <text x="65" y="52" class="text-body" font-size="12">Der berechnete Monatsdurchschnitt (Jahreskosten ÷ 12) ist eine neutrale Orientierung. Ihr realer Abschlag kann abweichen:</text>
    <text x="65" y="70" class="text-sub" font-size="11">Einige Versorger ziehen nur 11 Abschläge ein (12. Monat Abrechnung), verlangen Vorjahreszuschläge oder runden auf volle 5 Euro.</text>
  </g>
</svg>
