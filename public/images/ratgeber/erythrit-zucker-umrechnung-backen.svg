<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="erythritTitle erythritDesc">
  <title id="erythritTitle">Infografik: Erythrit statt Zucker beim Backen umrechnen</title>
  <desc id="erythritDesc">Vergleich der Süßkraft: 100 Gramm Haushaltszucker entsprechen rechnerisch rund 143 Gramm reinem Erythrit bei angenommener Süßkraft von 70 Prozent. Die Umrechnung vergleicht die Süße, nicht die Teigeigenschaften.</desc>
  <defs>
    <style>
      .canvas { fill: #ffffff; }
      .frame { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 2; rx: 16; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .box-active { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 12; }
      .text-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 18px; }
      .text-sub { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
      .text-label { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; }
      .text-val { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 26px; }
      .text-val-highlight { fill: #15803d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 26px; }
      .badge-qual { fill: #dcfce7; rx: 6; }
      .badge-qual-text { fill: #166534; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; }
      .op-circle { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; }
      .op-text { fill: #0369a1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 16px; text-anchor: middle; }
      .op-sub { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; text-anchor: middle; }
      .note-box { fill: #fefce8; stroke: #fde047; stroke-width: 1; rx: 8; }
      .note-text { fill: #854d0e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" class="canvas" />

  <!-- Outer Card Frame -->
  <rect x="20" y="20" width="760" height="320" class="frame" />

  <!-- Header -->
  <g transform="translate(45, 52)">
    <text class="text-title">Süßkraftvergleich: Haushaltszucker vs. reines Erythrit</text>
    <text class="text-sub" y="22">Mengenvergleich für Backrezepte – Süßkraft angeglichen, Teigeigenschaften separat prüfen</text>
  </g>

  <!-- Main Comparison Area -->
  <g transform="translate(45, 105)">
    <!-- Box 1: Zucker -->
    <rect x="0" y="0" width="280" height="115" class="box" />
    <text x="20" y="32" class="text-label">Ausgangsmenge im Rezept</text>
    <text x="20" y="68" class="text-val">100 g Zucker</text>
    <text x="20" y="96" class="text-sub">Haushaltszucker (100 % Süßkraft)</text>

    <!-- Center Operator: Division by 0.70 -->
    <g transform="translate(355, 57)">
      <circle cx="0" cy="0" r="28" class="op-circle" />
      <text x="0" y="5" class="op-text">÷ 0,70</text>
      <text x="0" y="42" class="op-sub">Umrechnung</text>
    </g>

    <!-- Box 2: Erythrit (Target) -->
    <rect x="430" y="0" width="285" height="115" class="box-active" />
    <text x="450" y="32" class="text-label" fill="#15803d">Rechnerische Ersatzmenge</text>
    <text x="450" y="68" class="text-val-highlight">≈ 143 g Erythrit</text>

    <!-- Visible Qualification Badge -->
    <rect x="450" y="82" width="245" height="22" class="badge-qual" />
    <text x="458" y="97" class="badge-qual-text">bei angenommener Süßkraft von 70 %</text>
  </g>

  <!-- Notice Banner: Baking disclaimer -->
  <g transform="translate(45, 245)">
    <rect x="0" y="0" width="710" height="65" class="note-box" />
    <text x="20" y="26" class="note-text" font-weight="700">Wichtiger Hinweis für das Backergebnis:</text>
    <text x="20" y="46" class="note-text">Die Umrechnung vergleicht nur die Süßkraft. Reines Erythrit bindet Feuchtigkeit anders, karamellisiert nicht wie Zucker</text>
    <text x="20" y="60" class="note-text">und führt bei 143 g zu einer größeren Trockenmasse im Teig. Eine identische Süße garantiert daher kein identisches Backergebnis.</text>
  </g>
</svg>
