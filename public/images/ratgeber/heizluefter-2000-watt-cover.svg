<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="coverHeaterTitle coverHeaterDesc">
  <title id="coverHeaterTitle">Illustration: Heizlüfter mit 2.000 Watt, Zeituhr und Stromkosten</title>
  <desc id="coverHeaterDesc">Ein elektrischer Heizlüfter im Betrieb mit Heizwellen neben einer Zeituhr und einem Kostenhinweis von 0,70 Euro pro Betriebsstunde bei 35 Cent pro Kilowattstunde.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .text-dark { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .text-muted { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .primary-dark { fill: #0369a1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .heater-body { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
      .heater-grille { fill: #1e293b; stroke: #334155; stroke-width: 2; }
      .heat-wave { fill: none; stroke: #ea580c; stroke-width: 3; stroke-linecap: round; opacity: 0.85; }
      .heat-wave-subtle { fill: none; stroke: #f97316; stroke-width: 2.5; stroke-linecap: round; opacity: 0.6; }
      .clock-face { fill: #ffffff; stroke: #0284c7; stroke-width: 4; }
      .clock-hand { stroke: #0f172a; stroke-width: 4; stroke-linecap: round; }
      .card-accent { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 16; }
    </style>
  </defs>

  <rect width="800" height="450" class="bg" />

  <!-- LEFT: ELECTRIC FAN HEATER (2000 Watt) -->
  <g transform="translate(60, 50)">
    <!-- Base stand -->
    <ellipse cx="170" cy="335" rx="110" ry="16" fill="#cbd5e1" />
    <rect x="130" y="300" width="80" height="32" rx="6" fill="#94a3b8" />

    <!-- Main Housing -->
    <rect x="50" y="40" width="240" height="270" rx="36" class="heater-body" />
    <rect x="65" y="55" width="210" height="240" rx="28" fill="#f1f5f9" />

    <!-- Front Air Grille -->
    <rect x="80" y="75" width="180" height="150" rx="16" class="heater-grille" />

    <!-- Grille Honeycomb / Ribs -->
    <line x1="95" y1="100" x2="245" y2="100" stroke="#475569" stroke-width="2.5" />
    <line x1="95" y1="120" x2="245" y2="120" stroke="#475569" stroke-width="2.5" />
    <line x1="95" y1="140" x2="245" y2="140" stroke="#ea580c" stroke-width="3" />
    <line x1="95" y1="160" x2="245" y2="160" stroke="#f97316" stroke-width="3" />
    <line x1="95" y1="180" x2="245" y2="180" stroke="#ea580c" stroke-width="3" />
    <line x1="95" y1="200" x2="245" y2="200" stroke="#475569" stroke-width="2.5" />

    <!-- Heat Waves Emitting -->
    <path d="M 270,110 Q 295,100 320,110 T 350,110" class="heat-wave-subtle" />
    <path d="M 270,140 Q 300,128 330,140 T 370,140" class="heat-wave" />
    <path d="M 270,170 Q 300,158 330,170 T 370,170" class="heat-wave" />
    <path d="M 270,200 Q 295,190 320,200 T 350,200" class="heat-wave-subtle" />

    <!-- Knobs at Bottom -->
    <circle cx="120" cy="258" r="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
    <line x1="120" y1="258" x2="132" y2="250" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <text x="120" y="288" text-anchor="middle" class="text-muted" font-size="10" font-weight="600">STUFE II (2000W)</text>

    <circle cx="220" cy="258" r="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
    <line x1="220" y1="258" x2="220" y2="244" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <text x="220" y="288" text-anchor="middle" class="text-muted" font-size="10" font-weight="600">THERMOSTAT</text>

    <!-- Power indicator lamp -->
    <circle cx="170" cy="242" r="5" fill="#ef4444" />
  </g>

  <!-- RIGHT: CLOCK & ELECTRICITY COST BADGE -->
  <g transform="translate(440, 50)">
    <!-- Clock Card -->
    <rect x="0" y="10" width="300" height="340" class="card-accent" />

    <!-- Clock Icon Graphic -->
    <g transform="translate(150, 95)">
      <circle cx="0" cy="0" r="58" class="clock-face" />
      <circle cx="0" cy="0" r="50" fill="#f8fafc" />

      <!-- Hour markers -->
      <circle cx="0" cy="-40" r="3" fill="#0284c7" />
      <circle cx="40" cy="0" r="3" fill="#0284c7" />
      <circle cx="0" cy="40" r="3" fill="#0284c7" />
      <circle cx="-40" cy="0" r="3" fill="#0284c7" />

      <!-- Clock Hands pointing to 1 Hour Elapsed -->
      <line x1="0" y1="0" x2="0" y2="-28" class="clock-hand" stroke-width="4" />
      <line x1="0" y1="0" x2="24" y2="0" class="clock-hand" stroke-width="3" stroke="#0284c7" />
      <circle cx="0" cy="0" r="5" fill="#0f172a" />
    </g>

    <text x="150" y="180" text-anchor="middle" class="text-dark" font-weight="700" font-size="16">1 Betriebsstunde</text>
    <text x="150" y="200" text-anchor="middle" class="text-muted" font-size="13">bei durchgehend 2.000 Watt</text>

    <!-- Calculation Badge -->
    <g transform="translate(25, 220)">
      <rect width="250" height="110" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" />
      <text x="125" y="28" text-anchor="middle" class="text-muted" font-size="13">Stromverbrauch: <tspan font-weight="700" fill="#0f172a">2,0 kWh</tspan></text>
      <text x="125" y="48" text-anchor="middle" class="text-muted" font-size="12">bei angenommenen 35 ct / kWh</text>

      <line x1="20" y1="60" x2="230" y2="60" stroke="#bae6fd" stroke-width="1" />

      <text x="125" y="80" text-anchor="middle" class="text-muted" font-size="12">KOSTEN PRO STUNDE</text>
      <text x="125" y="102" text-anchor="middle" fill="#0284c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24">0,70 € / Std.</text>
    </g>
  </g>
</svg>
