<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="milkCalcTitle milkCalcDesc">
  <title id="milkCalcTitle">Infografik: Rechenweg 1½ US-Cups Milch in Gramm</title>
  <desc id="milkCalcDesc">Zwei Berechnungsschritte: Schritt 1 Multiplikation von 1,5 Cups mit 236,6 ml ergibt 354,9 ml. Schritt 2 Multiplikation mit der Milchdichte 1,03 g/ml ergibt gerundet 366 Gramm Milch.</desc>
  <defs>
    <style>
      .canvas { fill: #ffffff; }
      .box { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 2; rx: 12; }
      .box-active { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; rx: 12; }
      .text-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; }
      .text-body { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
      .text-val { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 22px; }
      .text-highlight { fill: #0369a1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 24px; }
      .badge-step { fill: #0284c7; rx: 6; }
      .badge-step-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; }
      .op { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 22px; text-anchor: middle; }
    </style>
  </defs>

  <rect width="800" height="360" class="canvas" />

  <!-- Outer Card Frame -->
  <rect x="20" y="20" width="760" height="320" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(45, 48)">
    <text class="text-title" font-size="18">Rechenweg: 1½ US-Cups Milch in Milliliter und Gramm umrechnen</text>
    <text class="text-body" y="22">Schrittweise Berechnung vom US-Volumenmaß zum exakten Wiegeergebnis auf der Küchenwaage</text>
  </g>

  <!-- STEP 1: CUPS IN MILLILITER -->
  <g transform="translate(45, 95)">
    <!-- Step Badge -->
    <rect width="70" height="24" class="badge-step" />
    <text x="35" y="16" text-anchor="middle" class="badge-step-text">SCHRITT 1</text>
    <text x="82" y="17" class="text-title" font-size="15">Volumen in Milliliter ermitteln (US Customary Cup)</text>

    <!-- Calculation Row -->
    <g transform="translate(0, 32)">
      <!-- Box Cups -->
      <rect x="0" y="0" width="150" height="62" class="box" />
      <text x="15" y="22" class="text-body" font-size="11">Rezeptangabe</text>
      <text x="15" y="47" class="text-val">1,5 Cups</text>

      <!-- Multiply -->
      <text x="175" y="36" class="op">×</text>

      <!-- Box Volume per Cup -->
      <rect x="200" y="0" width="180" height="62" class="box" />
      <text x="15" y="22" transform="translate(200, 0)" class="text-body" font-size="11">US Customary Cup</text>
      <text x="15" y="47" transform="translate(200, 0)" class="text-val">236,6 ml</text>

      <!-- Equals -->
      <text x="405" y="36" class="op">=</text>

      <!-- Box Volume Result -->
      <rect x="430" y="0" width="280" height="62" class="box-active" />
      <text x="15" y="22" transform="translate(430, 0)" class="text-body" font-size="11" fill="#0369a1" font-weight="600">Volumen für den Messbecher</text>
      <text x="15" y="47" transform="translate(430, 0)" class="text-highlight">354,9 ml (ca. 355 ml)</text>
    </g>
  </g>

  <!-- STEP 2: MILLILITER IN GRAMM -->
  <g transform="translate(45, 212)">
    <!-- Step Badge -->
    <rect width="70" height="24" class="badge-step" />
    <text x="35" y="16" text-anchor="middle" class="badge-step-text">SCHRITT 2</text>
    <text x="82" y="17" class="text-title" font-size="15">Mit Milchdichte multiplizieren (Dichte ≈ 1,03 g/ml)</text>

    <!-- Calculation Row -->
    <g transform="translate(0, 32)">
      <!-- Box Volume -->
      <rect x="0" y="0" width="150" height="62" class="box" />
      <text x="15" y="22" class="text-body" font-size="11">Flüssigkeitsvolumen</text>
      <text x="15" y="47" class="text-val">354,9 ml</text>

      <!-- Multiply -->
      <text x="175" y="36" class="op">×</text>

      <!-- Box Density -->
      <rect x="200" y="0" width="180" height="62" class="box" />
      <text x="15" y="22" transform="translate(200, 0)" class="text-body" font-size="11">Dichte Vollmilch (Annahme)</text>
      <text x="15" y="47" transform="translate(200, 0)" class="text-val">1,03 g/ml</text>

      <!-- Equals -->
      <text x="405" y="36" class="op">=</text>

      <!-- Box Final Grams Result -->
      <rect x="430" y="0" width="280" height="62" rx="10" fill="#0284c7" stroke="#0369a1" stroke-width="2" />
      <text x="15" y="22" transform="translate(430, 0)" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">WIEGEWERT KÜCHENWAAGE</text>
      <text x="15" y="48" transform="translate(430, 0)" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22">365,5 g ≈ 366 Gramm</text>
    </g>
  </g>
</svg>
