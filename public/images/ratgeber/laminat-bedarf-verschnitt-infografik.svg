<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" role="img" aria-labelledby="laminatCalcTitle laminatCalcDesc">
  <title id="laminatCalcTitle">Infografik: Laminatbedarf, Paketanzahl und Verschnitt berechnen</title>
  <desc id="laminatCalcDesc">Drei Berechnungsschritte: 1. Raumfläche berechnen (5 mal 4 Meter gleich 20 Quadratmeter). 2. Verschnittzuschlag addieren (10 Prozent gleich 22 Quadratmeter Gesamtbedarf). 3. Paketanzahl und Transportgewicht ermitteln (10 Pakete à 15 Kilogramm gleich 150 Kilogramm).</desc>
  <defs>
    <style>
      .canvas { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .box-blue { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; rx: 12; }
      .box-amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; rx: 10; }
      .text-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 17px; }
      .text-sub { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
      .step-tag { fill: #0284c7; rx: 4; }
      .step-tag-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 0.5px; }
      .step-title { fill: #334155; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; }
      .step-val { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 19px; }
      .step-subtext { fill: #0284c7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 14px; }
      .arrow-line { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 4,3; }
    </style>
  </defs>

  <rect width="800" height="370" class="canvas" />
  <rect x="15" y="15" width="770" height="340" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(40, 42)">
    <text class="text-title">Laminat-Planung: Von der Raumfläche zu Paketen und Transportgewicht</text>
    <text class="text-sub" y="22">Musterbeispiel für einen Raum von 5,0 × 4,0 Metern mit 10 % Verschnittreserve</text>
  </g>

  <!-- Step 1: Reine Raumfläche -->
  <g transform="translate(40, 88)">
    <rect width="220" height="130" class="box" />
    <rect x="16" y="14" width="76" height="20" class="step-tag" />
    <text x="54" y="28" text-anchor="middle" class="step-tag-text">SCHRITT 1</text>
    <text x="16" y="56" class="step-title">Reine Raumfläche</text>
    <text x="16" y="82" class="step-val">5,0 m × 4,0 m</text>
    <text x="16" y="108" class="step-subtext">= 20,0 m² Boden</text>
  </g>

  <!-- Step 2: Verschnittreserve -->
  <g transform="translate(290, 88)">
    <rect width="220" height="130" class="box" />
    <rect x="16" y="14" width="76" height="20" class="step-tag" />
    <text x="54" y="28" text-anchor="middle" class="step-tag-text">SCHRITT 2</text>
    <text x="16" y="56" class="step-title">+ 10 % Verschnitt</text>
    <text x="16" y="82" class="step-val">+ 2,0 m² Reserve</text>
    <text x="16" y="108" class="step-subtext">= 22,0 m² Bedarf</text>
  </g>

  <!-- Step 3: Pakete & Gewicht -->
  <g transform="translate(540, 88)">
    <rect width="220" height="130" class="box-blue" />
    <rect x="16" y="14" width="76" height="20" class="step-tag" fill="#0369a1" />
    <text x="54" y="28" text-anchor="middle" class="step-tag-text">SCHRITT 3</text>
    <text x="16" y="56" class="step-title" fill="#0369a1">Pakete &amp; Gewicht</text>
    <text x="16" y="82" class="step-val" fill="#0369a1">10 Pakete à 2,2 m²</text>
    <text x="16" y="108" class="step-subtext" fill="#0f172a">ca. 150 kg Last</text>
  </g>

  <!-- Bottom Tip Banner -->
  <g transform="translate(40, 235)">
    <rect x="0" y="0" width="720" height="95" class="box-amber" />
    <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#92400e">Wichtiger Transport- und Lagerhinweis für Heimwerker:</text>
    <text x="18" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#78350f">30 Pakete für 60 m² Fläche wiegen ca. 450 kg – achten Sie unbedingt auf die maximale Zuladung Ihres Pkw.</text>
    <text x="18" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#78350f">Lagern Sie Pakete vor dem Verlegen mindestens 48 Stunden flach liegend im temperierten Raum zur Akklimatisierung.</text>
  </g>
</svg>
