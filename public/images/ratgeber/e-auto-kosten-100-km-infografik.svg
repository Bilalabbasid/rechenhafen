<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" role="img" aria-labelledby="eAutoCalcTitle eAutoCalcDesc">
  <title id="eAutoCalcTitle">Infografik: Stromkosten eines Elektroautos auf 100 km berechnen</title>
  <desc id="eAutoCalcDesc">Formel und Rechenbeispiel: Verbrauch in kWh pro 100 km multipliziert mit dem Strompreis in Euro pro kWh unter Berücksichtigung von Ladeverlusten.</desc>
  <defs>
    <style>
      .canvas { fill: #ffffff; }
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 14; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .box-highlight { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; rx: 10; }
      .box-wallbox { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.5; rx: 10; }
      .box-schnell { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; rx: 10; }
      .text-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 17px; }
      .text-subtitle { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
      .label-sub { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; }
      .val-main { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 20px; }
      .val-result { fill: #059669; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 24px; }
      .op-sign { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 22px; text-anchor: middle; }
    </style>
  </defs>

  <rect width="800" height="370" class="canvas" />
  <rect x="15" y="15" width="770" height="340" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(40, 42)">
    <text class="text-title">E-Auto Stromkosten: So setzt sich der Preis für 100 km zusammen</text>
    <text class="text-subtitle" y="22">Formel: Stromverbrauch (kWh/100 km) × Strompreis (€/kWh) inkl. ca. 10 % Ladeverluste</text>
  </g>

  <!-- Formula Boxes -->
  <g transform="translate(40, 92)">
    <!-- Box 1: Verbrauch -->
    <rect x="0" y="0" width="195" height="90" class="box" />
    <text x="16" y="24" class="label-sub">Fahrzeugverbrauch</text>
    <text x="16" y="52" class="val-main">18 kWh / 100 km</text>
    <text x="16" y="74" class="label-sub" fill="#0284c7">+ ca. 10 % Ladeverluste</text>

    <!-- Multiplication Operator -->
    <text x="220" y="52" class="op-sign">×</text>

    <!-- Box 2: Strompreis -->
    <rect x="245" y="0" width="195" height="90" class="box" />
    <text x="16" y="24" transform="translate(245, 0)" class="label-sub">Strompreis (z. B. Wallbox)</text>
    <text x="16" y="52" transform="translate(245, 0)" class="val-main">0,35 € / kWh</text>
    <text x="16" y="74" transform="translate(245, 0)" class="label-sub">Hausstrom-Beispieltarif</text>

    <!-- Equals Operator -->
    <text x="465" y="52" class="op-sign">=</text>

    <!-- Box 3: Ergebnis -->
    <rect x="490" y="0" width="230" height="90" class="box-highlight" />
    <text x="16" y="24" transform="translate(490, 0)" class="label-sub" fill="#047857" font-weight="700">Gesamtkosten für 100 km</text>
    <text x="16" y="54" transform="translate(490, 0)" class="val-result">7,00 €</text>
    <text x="16" y="74" transform="translate(490, 0)" class="label-sub" fill="#059669">(6,30 € rein netto)</text>
  </g>

  <!-- Comparison Section -->
  <g transform="translate(40, 205)">
    <rect x="0" y="0" width="720" height="125" class="card-bg" />
    <text x="20" y="26" class="text-title" font-size="14">Kostenvergleich: Wo Sie laden, macht den Unterschied</text>

    <!-- Wallbox Card -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="325" height="66" class="box-wallbox" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0369a1">Heimische Wallbox (0,35 €/kWh)</text>
      <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#0284c7">ca. 7,00 € <tspan font-size="12" font-weight="500" fill="#64748b">/ 100 km</tspan></text>
    </g>

    <!-- Schnelllader Card -->
    <g transform="translate(375, 40)">
      <rect x="0" y="0" width="325" height="66" class="box-schnell" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">Öffentlicher Schnelllader (0,65 €/kWh)</text>
      <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#dc2626">ca. 13,00 € <tspan font-size="12" font-weight="500" fill="#64748b">/ 100 km</tspan></text>
    </g>
  </g>
</svg>
