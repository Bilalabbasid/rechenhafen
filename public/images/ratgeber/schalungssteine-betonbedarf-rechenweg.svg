<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="schalungCalcTitle schalungCalcDesc">
  <title id="schalungCalcTitle">Infografik: Rechenweg Betonbedarf Schalungssteine</title>
  <desc id="schalungCalcDesc">Schritt 1: 12 Quadratmeter Wandfläche mal 130 Liter pro Quadratmeter Herstellerangabe gleich 1.560 Liter bzw. 1,56 Kubikmeter Füllbeton. Schritt 2: Optionaler 5 Prozent Bestellzuschlag plus 0,078 Kubikmeter ergibt gerundet 1,64 Kubikmeter Gesamtbestellung.</desc>
  <defs>
    <style>
      .canvas { fill: #ffffff; }
      .box { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 2; rx: 12; }
      .box-active { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; rx: 12; }
      .text-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; }
      .text-body { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
      .text-val { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 22px; }
      .text-highlight { fill: #0369a1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 24px; }
      .badge-step { fill: #0284c7; rx: 6; }
      .badge-step-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; }
      .op { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 22px; text-anchor: middle; }
    </style>
  </defs>

  <rect width="800" height="360" class="canvas" />

  <!-- Outer Card Frame -->
  <rect x="20" y="20" width="760" height="320" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(45, 48)">
    <text class="text-title" font-size="18">Zweistufiger Rechenweg: Füllbetonbedarf &amp; getrennter Bestellzuschlag</text>
    <text class="text-body" y="22">Beispielrechnung für eine 12-m²-Mauer mit Herstellerangabe 130 l/m² (z. B. Delfing DP 24)</text>
  </g>

  <!-- STEP 1: FÜLLMENGE AUS WANDFLÄCHE -->
  <g transform="translate(45, 95)">
    <!-- Step Badge -->
    <rect width="70" height="24" class="badge-step" />
    <text x="35" y="16" text-anchor="middle" class="badge-step-text">SCHRITT 1</text>
    <text x="82" y="17" class="text-title" font-size="15">Geometrisches Füllvolumen aus Wandfläche ermitteln</text>

    <!-- Calculation Row -->
    <g transform="translate(0, 32)">
      <!-- Box Area -->
      <rect x="0" y="0" width="150" height="62" class="box" />
      <text x="15" y="22" class="text-body" font-size="11">Netto-Wandfläche</text>
      <text x="15" y="47" class="text-val">12,0 m²</text>

      <!-- Multiply -->
      <text x="175" y="36" class="op">×</text>

      <!-- Box Fill Rate -->
      <rect x="200" y="0" width="180" height="62" class="box" />
      <text x="15" y="22" transform="translate(200, 0)" class="text-body" font-size="11">Hersteller-Füllmenge</text>
      <text x="15" y="47" transform="translate(200, 0)" class="text-val">130 l/m²</text>

      <!-- Equals -->
      <text x="405" y="36" class="op">=</text>

      <!-- Box Volume Result -->
      <rect x="430" y="0" width="280" height="62" class="box-active" />
      <text x="15" y="22" transform="translate(430, 0)" class="text-body" font-size="11" fill="#0369a1" font-weight="600">Reines Füllvolumen (ohne Reserve)</text>
      <text x="15" y="47" transform="translate(430, 0)" class="text-highlight">1.560 l = 1,56 m³</text>
    </g>
  </g>

  <!-- STEP 2: SEPARATE BETONRESERVE -->
  <g transform="translate(45, 212)">
    <!-- Step Badge -->
    <rect width="70" height="24" class="badge-step" />
    <text x="35" y="16" text-anchor="middle" class="badge-step-text">SCHRITT 2</text>
    <text x="82" y="17" class="text-title" font-size="15">Separaten Bestellzuschlag hinzurechnen (z. B. 5 %)</text>

    <!-- Calculation Row -->
    <g transform="translate(0, 32)">
      <!-- Box Füllvolumen -->
      <rect x="0" y="0" width="150" height="62" class="box" />
      <text x="15" y="22" class="text-body" font-size="11">Füllvolumen</text>
      <text x="15" y="47" class="text-val">1,560 m³</text>

      <!-- Multiply -->
      <text x="175" y="36" class="op">×</text>

      <!-- Box Reserve Factor -->
      <rect x="200" y="0" width="180" height="62" class="box" />
      <text x="15" y="22" transform="translate(200, 0)" class="text-body" font-size="11">Bestellzuschlag (5 %)</text>
      <text x="15" y="47" transform="translate(200, 0)" class="text-val">Faktor 1,05</text>

      <!-- Equals -->
      <text x="405" y="36" class="op">=</text>

      <!-- Box Final Delivery Result -->
      <rect x="430" y="0" width="280" height="62" rx="10" fill="#0284c7" stroke="#0369a1" stroke-width="2" />
      <text x="15" y="22" transform="translate(430, 0)" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">BETON-BESTELLMENGE</text>
      <text x="15" y="48" transform="translate(430, 0)" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22">1,638 m³ ≈ 1,64 m³</text>
    </g>
  </g>
</svg>
