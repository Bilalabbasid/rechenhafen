<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="primaryGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="cardShadow2" x="-2%" y="-4%" width="104%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" rx="16" fill="url(#bgGrad2)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title / Badge -->
  <rect x="36" y="24" width="220" height="28" rx="6" fill="#e0e7ff"/>
  <text x="48" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#4338ca" letter-spacing="0.5">ZEITRECHNUNG &amp; ALTER</text>
  <text x="36" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Vollendete Lebensmonate vs. Laufender Lebensmonat</text>

  <!-- Main Timeline Card -->
  <g transform="translate(36, 105)">
    <rect width="728" height="185" rx="12" fill="url(#cardGrad2)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow2)"/>

    <!-- Timeline Horizontal Track -->
    <line x1="60" y1="75" x2="668" y2="75" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
    <!-- Completed Section Track (15. Jan -> 15. März) -->
    <line x1="60" y1="75" x2="440" y2="75" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
    <!-- Running Section Track (15. März -> 25. März) -->
    <line x1="440" y1="75" x2="560" y2="75" stroke="#06b6d4" stroke-width="8" stroke-dasharray="6,4"/>

    <!-- Point 0: Birth -->
    <circle cx="60" cy="75" r="14" fill="#1e293b" stroke="#ffffff" stroke-width="3"/>
    <text x="60" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">15. Januar</text>
    <text x="60" y="110" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Geburtstag</text>
    <text x="60" y="126" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Tag 0 (Beginn)</text>

    <!-- Point 1: 1st Month completed -->
    <circle cx="250" cy="75" r="12" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
    <text x="250" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">15. Februar</text>
    <rect x="180" y="100" width="140" height="24" rx="4" fill="#eff6ff"/>
    <text x="250" y="116" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">1 Monat vollendet</text>
    <text x="250" y="136" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">(im 2. Lebensmonat)</text>

    <!-- Point 2: 2nd Month completed -->
    <circle cx="440" cy="75" r="14" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
    <text x="440" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">15. März</text>
    <rect x="370" y="100" width="140" height="24" rx="4" fill="#eff6ff"/>
    <text x="440" y="116" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="middle">2 Monate vollendet</text>
    <text x="440" y="136" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0284c7" text-anchor="middle">Beginn 3. Lebensmonat</text>

    <!-- Point 3: Reference Stichtag (25. März) -->
    <circle cx="560" cy="75" r="12" fill="#0891b2" stroke="#ffffff" stroke-width="3"/>
    <text x="560" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0891b2" text-anchor="middle">25. März (Stichtag)</text>
    <rect x="495" y="100" width="130" height="38" rx="6" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="560" y="116" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0e7490" text-anchor="middle">2 Monate + 10 Tage</text>
    <text x="560" y="130" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0891b2" text-anchor="middle">laufender 3. Monat</text>

    <!-- Point 4: 3rd Month completed in future -->
    <circle cx="668" cy="75" r="8" fill="#94a3b8" stroke="#ffffff" stroke-width="2"/>
    <text x="668" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">15. April</text>
    <text x="668" y="110" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">3 Monate vollendet</text>

    <!-- Summary strip below -->
    <line x1="20" y1="150" x2="708" y2="150" stroke="#f1f5f9" stroke-width="1"/>
    <text x="40" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e293b">
      Ergebnis am 25. März: <tspan fill="#2563eb">2 vollendete Lebensmonate</tspan> und 10 Resttage. Das Kind befindet sich mitten im <tspan fill="#0891b2">3. Lebensmonat</tspan>.
    </text>
  </g>

  <!-- Bottom Info / Standards Footer -->
  <text x="400" y="325" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">
    RechenHafen.de • Kalendermonate nach § 188 BGB • Keine pauschale 30-Tage-Division
  </text>
</svg>
